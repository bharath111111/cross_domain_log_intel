[package]
name = "cross_domain_log_intel"
version = "0.1.0"
edition = "2021"

[dependencies]
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
rayon = { version = "1.7", optional = true }
actix-web = "4.4"
actix-multipart = "0.4"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
tempfile = "3.8"
futures-util = "0.3"
bytes = "1"

[[bin]]
name = "cli"
path = "src/bin/cli.rs"

[[bin]]
name = "web"
path = "src/bin/web.rs"
